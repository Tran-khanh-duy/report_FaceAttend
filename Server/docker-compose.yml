version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: face_attendance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-face_attendance}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis - In-memory Database & Queue (State Manager)
  redis:
    image: redis:7-alpine
    container_name: face_attendance_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Server - Backend chính
  api:
    build: .
    container_name: face_attendance_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-face_attendance}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEVICE_TOKEN=${DEVICE_TOKEN:-SECRET_TOKEN_123}
      - ALLOWED_IPS=${ALLOWED_IPS:-192.168.1.0/24,127.0.0.1}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./reports:/app/reports
    # Chế độ host network cho phép API quét LAN (Wake on LAN) tốt hơn nếu chạy trên Linux
    # network_mode: "host" 

volumes:
  mysql_data:
  redis_data:
